syntax = "proto3";

package room;

option go_package = "demo_server/gen/room;roompb";

/************ service ************/
// RoomService 房间服务
service RoomService {
  // JoinRoom 加入房间
  rpc JoinRoom(JoinRoomReq) returns (JoinRoomResp);
  // GetPlayerStats 查询玩家战绩
  rpc GetPlayerStats(PlayerStatsReq) returns (PlayerStatsResp);
}

/************ message ************/
// JoinRoomReq 加入房间请求
message JoinRoomReq {
  string token = 1; // 入房令牌
  reserved 2, 3, 4;
  reserved "sync_version", "prediction_enabled", "physics_hash";
}

// JoinRoomResp 加入房间响应
message JoinRoomResp {
  bool status = 1; // 状态
  string content = 2; // 返回信息
  string room_id = 3; // 房间ID
  int64 tick = 4; // 当前帧号
  string spawn_id = 5; // 出生点ID
  double x = 6; // 初始X坐标
  double y = 7; // 初始Y坐标
  double z = 8; // 初始Z坐标
  double yaw = 9; // 初始水平视角
  double pitch = 10; // 初始垂直视角
  int32 tick_rate = 11; // 逻辑帧率
  int32 snapshot_rate = 12; // 快照频率
  int64 server_time = 13; // 服务端时间戳
  reserved 14, 17, 18, 19, 20, 21, 22;
  reserved "sync_mode", "rollback_window_ticks", "future_input_window_ticks", "prediction_keyframe_interval", "position_tolerance", "hard_position_tolerance", "angle_tolerance";
  string map_id = 15; // 地图ID
  string physics_hash = 16; // 服务端物理数据hash
  int64 game_duration_seconds = 23; // 对局时长秒数
  bool game_started = 24; // 是否已开始对局
  int64 game_start_tick = 25; // 对局开始帧号
  int64 game_end_tick = 26; // 对局结束帧号
  int32 gun_id = 27; //装备额武器id
}

// Heartbeat 心跳消息
message Heartbeat {
  int64 client_time = 1; // 客户端时间戳
  int64 server_time = 2; // 服务端时间戳
  int64 server_tick = 3; // 服务端房间帧号
}

// LeaveRoomReq 主动离开房间请求
message LeaveRoomReq {
}

// PlayerInput 玩家输入
message PlayerInput {
  int64 client_tick = 1; // 客户端帧号
  double move_x = 2; // 左右移动输入
  double move_z = 3; // 前后移动输入
  double yaw = 4; // 水平视角
  double pitch = 5; // 垂直视角
  bool fire = 6; // 是否开火
  bool jump = 7; // 是否跳跃
}

// PlayerState 玩家状态
message PlayerState {
  uint64 player_id = 1; // 玩家ID
  double x = 2; // X坐标
  double y = 3; // Y坐标
  double z = 4; // Z坐标
  double yaw = 5; // 水平视角
  double pitch = 6; // 垂直视角
  int32 hp = 7; // 生命值
  string spawn_id = 8; // 出生点ID
  int32 kill_count = 9; // 击杀数量
  int32 death_count = 10; // 死亡数量
  bool invincible = 11; // 是否无敌
  int64 invincible_until_tick = 12; // 无敌结束帧号
}

// Snapshot 状态快照
message Snapshot {
  int64 server_tick = 1; // 服务端帧号
  repeated PlayerState players = 2; // 可见玩家
}

// GameStart 对局开始通知
message GameStart {
  string room_id = 1; // 房间ID
  int64 server_tick = 2; // 服务端当前帧号
  int64 start_tick = 3; // 对局开始帧号
  int64 end_tick = 4; // 对局结束帧号
  int64 duration_seconds = 5; // 对局时长秒数
  int64 server_time = 6; // 服务端时间戳
}

// GameOver 对局结束通知
message GameOver {
  string room_id = 1; // 房间ID
  int64 server_tick = 2; // 服务端当前帧号
  int64 start_tick = 3; // 对局开始帧号
  int64 end_tick = 4; // 对局结束帧号
  string reason = 5; // 结束原因
  int64 server_time = 6; // 服务端时间戳
  repeated PlayerState players = 7; // 结束时玩家状态
}

// PlayerStatsReq 玩家战绩查询请求
message PlayerStatsReq {
  uint64 player_id = 1; // 目标玩家ID，为0时查询自己
}

// PlayerStats 玩家战绩
message PlayerStats {
  uint64 player_id = 1; // 玩家ID
  int32 kill_count = 2; // 击杀数量
  int32 death_count = 3; // 死亡数量
}

// PlayerStatsResp 玩家战绩查询响应
message PlayerStatsResp {
  bool status = 1; // 状态
  string content = 2; // 返回信息
  string room_id = 3; // 房间ID
  int64 server_tick = 4; // 服务端当前帧号
  PlayerStats stats = 5; // 玩家战绩
}

// ErrorResp 错误响应
message ErrorResp {
  string code = 1; // 错误码
  string content = 2; // 错误信息
}
