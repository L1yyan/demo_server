syntax = "proto3";

package logic;

option go_package = "demo_server/gen/logic;logicpb";

// LogicService 逻辑服服务
service LogicService {
  // Login 邮箱密码登录
  rpc Login(LoginReq) returns (AuthResp);

  // Register 用户注册
  rpc Register(RegisterReq) returns (AuthResp);

  // SendVerifyCode 保留兼容，注册不再使用验证码
  rpc SendVerifyCode(SendVerifyCodeReq) returns(SendVerifyCodeResp);

  // VerifyToken 校验登录令牌
  rpc VerifyToken(VerifyTokenReq) returns(AuthResp);

  // MatchRoom 请求匹配房间
  rpc MatchRoom(MatchRoomReq) returns(MatchRoomResp);
}

// LoginReq 登录请求
message LoginReq {
  string email = 1; // 邮箱
  string password = 2; // 密码
}

// RegisterReq 注册请求
message RegisterReq {
  string email = 1; // 邮箱

  string password = 3; // 密码
}

// AuthResp 认证响应
message AuthResp {
  bool status = 1; // 状态
  string content = 2; // 返回信息
  string access_token = 3; // 短token
  string refresh_token = 4; // 长期token
}

// SendVerifyCodeReq 发送验证码请求
message SendVerifyCodeReq {
  string email = 1; // 邮箱
}

// SendVerifyCodeResp 发送验证码响应
message SendVerifyCodeResp {
  bool status = 1; // 状态
  string content = 2; // 返回信息
  string verification_code = 3; // 验证码
}

// VerifyTokenReq 令牌校验请求
message VerifyTokenReq {
  string access_token = 1; // 短token
  string refresh_token = 2; // 长期token
}

// MatchRoomReq 匹配请求
message MatchRoomReq {
  string access_token = 1; // 短token
  string refresh_token = 2; // 长期token
  string mode = 3; // 匹配模式
}

// MatchRoomResp 匹配响应
message MatchRoomResp {
  bool status = 1; // 状态
  string content = 2; // 返回信息
  string access_token = 3; // 当前可用短token
  string refresh_token = 4; // 长期token
  string room_id = 5; // 房间ID
  string server_id = 6; // roomserver ID
  string server_addr = 7; // roomserver连接地址
  string match_id = 8; // 匹配ID
  string room_token = 9; // 入房令牌
  int64 expire_at = 10; // 过期时间戳，毫秒
}

//ModifyPlayerNicknameReq 修改玩家自己的昵称
message ModifyPlayerNicknameReq {
  string access_token = 1; //短token
  string refresh_token = 2; //长期token
  string player_Nickname = 3; //玩家想改的昵称
}

//ModifyPlayerNicknameResq 修改玩家自己的昵称响应
message ModifyPlayerNicknameResp {
  bool status = 1; //状态
  string content = 2; //返回信息
}

// ModifyPlayerProfilePhotoReq 修改玩家头像请求
message ModifyPlayerProfilePhotoReq {
  string access_token = 1; //短token
  string refresh_token = 2; //长期token
  int32 player_profile_photo_id = 3; //玩家头像id
}

// ModifyPlayerProfilePhotoResp 修改玩家头像响应
message ModifyPlayerProfilePhotoResp {
  bool status = 1; //状态
  string content = 2; //返回信息
}

// PlayerInfoReq 玩家账户信息请求
message GetPlayerInfoReq {
  string access_token = 1; //短token
  string refresh_token = 2; //长期token
  uint64 player_id = 3; //想要查询信息的玩家id
}

//PlayerInfoResq 玩家账户信息响应
message GetPlayerInfoResp {
  bool status = 1; //状态
  string content = 2; //返回信息
  string access_token = 3; //当前可用短token
  string refresh_token = 4; //长期token
  string player_Nickname = 5; //玩家昵称
  string player_level = 6; //玩家等级
  uint64 player_experience = 7; // 玩家经验值
  uint64 player_id = 8; //玩家ID
  uint64 player_coins = 9; //玩家货币数量
  int32 player_profile_photo_id = 10; // 玩家头像id (头像都是服务端预设的几个图片，传入id就可以获得指定头像)
}