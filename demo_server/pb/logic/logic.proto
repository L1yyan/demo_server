syntax = "proto3";

package logic;

option go_package = "demo_server/gen/logic;logicpb";

// LogicService 逻辑服服务
service LogicService {
  // Login 邮箱密码登录
  rpc Login(LoginReq) returns (AuthResp);

  // Register 用户注册
  rpc Register(RegisterReq) returns (AuthResp);

  // SendVerifyCode 保留兼容，注册不再使用验证码
  rpc SendVerifyCode(SendVerifyCodeReq) returns(SendVerifyCodeResp);

  // VerifyToken 校验登录令牌
  rpc VerifyToken(VerifyTokenReq) returns(AuthResp);

  // MatchRoom 请求匹配房间
  rpc MatchRoom(MatchRoomReq) returns(MatchRoomResp);

  //ModifyPlayerNickname 修改玩家自己的昵称
  rpc ModifyPlayerNickname(ModifyPlayerNicknameReq) returns (ModifyPlayerNicknameResp);

  //ModifyPlayerProfilePhoto 修改玩家自己的头像
  rpc ModifyPlayerProfilePhoto(ModifyPlayerProfilePhotoReq) returns (ModifyPlayerProfilePhotoResp);

  //GetPlayerInfo 获取玩家账户信息
  rpc GetPlayerInfo(GetPlayerInfoReq) returns (GetPlayerInfoResp);

  //SettleUpGameRewardAndKd 结算对局奖励和落盘玩家击杀与死亡数量
  rpc SettleUpGameRewardAndKd(SettleUpGameRewardAndKdReq) returns (SettleUpGameRewardAndKdResp);

  //GetMallDetails 获取商店列表信息
  rpc GetMallDetails(GetMallDetailsReq) returns (GetMallDetailsResp);

  //BuyGun 购买武器
  rpc BuyGun(BuyGunReq) returns (BuyGunResp);
}

// LoginReq 登录请求
message LoginReq {
  string email = 1; // 邮箱
  string password = 2; // 密码
}

// RegisterReq 注册请求
message RegisterReq {
  string email = 1; // 邮箱

  string password = 3; // 密码
}

// AuthResp 认证响应
message AuthResp {
  bool status = 1; // 状态
  string content = 2; // 返回信息
  string access_token = 3; // 短token
  string refresh_token = 4; // 长期token
}

// SendVerifyCodeReq 发送验证码请求
message SendVerifyCodeReq {
  string email = 1; // 邮箱
}

// SendVerifyCodeResp 发送验证码响应
message SendVerifyCodeResp {
  bool status = 1; // 状态
  string content = 2; // 返回信息
  string verification_code = 3; // 验证码
}

// VerifyTokenReq 令牌校验请求
message VerifyTokenReq {
  string access_token = 1; // 短token
  string refresh_token = 2; // 长期token
}

// MatchRoomReq 匹配请求
message MatchRoomReq {
  string access_token = 1; // 短token
  string refresh_token = 2; // 长期token
  string mode = 3; // 匹配模式
}

// MatchRoomResp 匹配响应
message MatchRoomResp {
  bool status = 1; // 状态
  string content = 2; // 返回信息
  string access_token = 3; // 当前可用短token
  string refresh_token = 4; // 长期token
  string room_id = 5; // 房间ID
  string server_id = 6; // roomserver ID
  string server_addr = 7; // roomserver连接地址
  string match_id = 8; // 匹配ID
  string room_token = 9; // 入房令牌
  int64 expire_at = 10; // 过期时间戳，毫秒
}

//ModifyPlayerNicknameReq 修改玩家自己的昵称
message ModifyPlayerNicknameReq {
  string access_token = 1; //短token
  string refresh_token = 2; //长期token
  string player_Nickname = 3; //玩家想改的昵称
}

//ModifyPlayerNicknameResq 修改玩家自己的昵称响应
message ModifyPlayerNicknameResp {
  bool status = 1; //状态
  string content = 2; //返回信息
}

// ModifyPlayerProfilePhotoReq 修改玩家头像请求
message ModifyPlayerProfilePhotoReq {
  string access_token = 1; //短token
  string refresh_token = 2; //长期token
  int32 player_profile_photo_id = 3; //玩家头像id
}

// ModifyPlayerProfilePhotoResp 修改玩家头像响应
message ModifyPlayerProfilePhotoResp {
  bool status = 1; //状态
  string content = 2; //返回信息
}

//GetPlayerInfoReq 获取玩家账户信息请求
message GetPlayerInfoReq {
  string access_token = 1; //短token
  string refresh_token = 2; //长期token
  uint64 player_id = 3; //想要查询信息的玩家id
}

//GetPlayerInfoResq 获取玩家账户信息响应
message GetPlayerInfoResp {
  bool status = 1; //状态
  string content = 2; //返回信息
  string access_token = 3; //当前可用短token
  string refresh_token = 4; //长期token
  string player_Nickname = 5; //玩家昵称
  string player_level = 6; //玩家等级
  uint64 player_exp = 7; // 玩家经验值
  uint64 player_id = 8; //玩家ID
  uint64 player_coins = 9; //玩家货币数量
  int32 player_profile_photo_id = 10; // 玩家头像id (头像都是服务端预设的几个图片，传入id就可以获得指定头像)
}

//SettleUpGameRewardAndKdReq 结算对局奖励和落盘玩家击杀与死亡数量请求
message SettleUpGameRewardAndKdReq {
  string access_token = 1; //短token
  string refresh_token = 2; //长期token
  repeated uint64 player_ids = 3; //房间内所有玩家id数组
  repeated int64 exp = 4; //对局获得的经验
  repeated int64 coin = 5; //对局获得的金币
  repeated int64 kill_count = 6; //对局击杀数量
}

//SettleUpGameRewardAndKdResp 结算对局奖励和落盘玩家击杀与死亡数量响应
message SettleUpGameRewardAndKdResp {
  bool status = 1; //状态
  string content = 2; //返回信息
}

//****商店相关****//

//GetMallDetailsReq 获取商店列表信息请求
message GetMallDetailsReq {
  string access_token = 1; //短token
  string refresh_token = 2; //长期token
}

//GetMallDetailsResp 获取商店列表信息响应
message GetMallDetailsResp {
  bool status = 1; //状态
  string content = 2; //返回信息 
  repeated int32 gun_ids = 3; //商店在售枪械列表
}

//BuyGunReq 购买武器请求
message BuyGunReq {
  string access_token = 1; //短token
  string refresh_token = 2; //长token
  int32 gun_id = 3; //想要购买的武器id
}

//BuyGunResp 购买武器响应
message BuyGunResp {
  bool status = 1; //状态
  string content = 2; //返回信息
}